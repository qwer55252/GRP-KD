name: Lightweight checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install "soundfile>=0.12,<0.14"
      - run: python -m compileall -q grp_kd cmd tests
      - run: python -m unittest discover -s tests -v
      - run: python -m grp_kd.train --help
      - run: python -m grp_kd.evaluate --help
      - run: bash -n cmd/train_ver5_ls100.sh cmd/train_ver5_ls960.sh cmd/evaluate_librispeech.sh
